  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">

          <div class="brand">FOOD<span>MART</span></div>
          <div class="sub">All Products</div>
        </div>
      </a>
      <div class="search-wrap">
        <input class="search-input" type="text" placeholder="Search all products" id="searchInput" />
        <button class="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <a href="account.html" class="cart-btn">My Account</a>
      <a href="index.html" class="cart-btn">Back Home</a>
    </div>
  </header>

  <section class="products-section">
    <div class="section-header">
      <div>
        <h2 class="section-title">All <span>Products</span></h2>
        <p class="section-subtitle">Browse every FoodMart item in one place</p>
      </div>
      <strong class="view-all" id="productCount">0 products</strong>
    </div>

    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="all">All Products</button>
      <button class="cat-tab" data-cat="fruits">🍎 Fruits</button>
      <button class="cat-tab" data-cat="vegetables">🥦 Vegetables</button>
      <button class="cat-tab" data-cat="dairy">🧀 Dairy</button>
      <button class="cat-tab" data-cat="bakery">🍞 Bakery</button>
      <button class="cat-tab" data-cat="beverages">🧃 Beverages</button>
      <button class="cat-tab" data-cat="snacks">🍿 Snacks</button>
      <button class="cat-tab" data-cat="meat">🥩 Meat & Fish</button>
      <button class="cat-tab" data-cat="frozen">❄️ Frozen</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </section>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">x</button>
      <div class="modal-img-wrap">
        <img id="modalImg" src="" alt="" />
        <div class="modal-badges" id="modalBadges"></div>
      </div>
      <div class="modal-info">
        <div class="modal-category" id="modalCat"></div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-stars">
          <span class="stars" id="modalStars"></span>
          <span class="rating-count" id="modalReviews"></span>
        </div>
        <div class="modal-divider"></div>
        <div class="modal-meta">
          <div class="modal-meta-item"><strong id="modalWeight"></strong>Net Weight</div>
          <div class="modal-meta-item"><strong id="modalOrganic"></strong>Organic</div>
          <div class="modal-meta-item"><strong id="modalAvail">In Stock</strong>Availability</div>
        </div>
        <div class="modal-desc" id="modalDesc"></div>
        <div class="modal-price-row">
          <span class="modal-price-now" id="modalPriceNow"></span>
          <span class="modal-price-old" id="modalPriceOld"></span>
          <span class="modal-save" id="modalSave"></span>
        </div>
        <div class="modal-qty-row">
          <div class="qty-ctrl">
            <button class="qty-btn" id="qtyMinus">-</button>
            <span class="qty-num" id="qtyNum">1</span>
            <button class="qty-btn" id="qtyPlus">+</button>
          </div>
          <button class="modal-add-btn" id="modalAddBtn">Add to Cart</button>
          <button class="modal-wish-btn" id="modalWishBtn" title="Wishlist">♡</button>
        </div>
        <div class="modal-tags" id="modalTags"></div>
      </div>
    </div>
  </div>

      { id:149, cat:'frozen', img:'https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?w=400&q=80&auto=format&fit=crop', name:'Mixed Vegetables', weight:'750 g', price:3.49, old:4.29, stars:4, reviews:98, badge:'sale', organic:true },
      { id:150, cat:'frozen', img:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&q=80&auto=format&fit=crop', name:'Cheesecake', weight:'700 g', price:10.99, old:null, stars:5, reviews:143, badge:'new', organic:false },
      { id:151, cat:'frozen', img:'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400&q=80&auto=format&fit=crop', name:'Four Cheese Pizza', weight:'430 g', price:7.99, old:9.99, stars:5, reviews:156, badge:'sale', organic:false },
      { id:152, cat:'frozen', img:'https://images.unsplash.com/photo-1563245372-f21724e3856d?w=400&q=80&auto=format&fit=crop', name:'Shrimp Dumplings', weight:'320 g', price:8.49, old:null, stars:5, reviews:87, badge:'hot', organic:false }
    ];

    const CART_KEY = 'foodmart_demo_cart';
    const WISH_KEY = 'foodmart_demo_wishlist';
    let currentCat = 'all';
    let modalProduct = null;
    let modalQty = 1;

    const DESCRIPTIONS = {
      fruits: 'Fresh, naturally sweet fruit selected for ripeness and flavor. Perfect for breakfast, snacks, smoothies, and healthy desserts.',
      vegetables: 'Crisp vegetables picked for everyday cooking, salads, soups, and meal prep. Stored carefully to keep texture and color.',
      dairy: 'Creamy dairy favorites for cooking, baking, breakfast, and quick meals. Great for families and weekly grocery baskets.',
      bakery: 'Soft, fresh bakery products with comforting flavor and ready-to-serve convenience for breakfast, snacks, or dessert.',
      beverages: 'Refreshing drinks for daily hydration, quick energy, and chilled moments with meals or snacks.',
      snacks: 'Easy snack options for sharing, lunch boxes, movie nights, or quick bites between meals.',
      meat: 'Quality meat and seafood choices for filling dinners, meal prep, grilling, and family recipes.',
      frozen: 'Convenient frozen favorites ready when you need a quick meal, side dish, or dessert.'
    };

    const TAG_MAP = {
      fruits: ['Fresh Pick', 'Vitamin Rich', 'Farm Selected'],
      vegetables: ['Kitchen Ready', 'Naturally Grown', 'Fresh Stock'],
      dairy: ['Chilled', 'Creamy', 'Family Favorite'],
      bakery: ['Fresh Baked', 'Soft Texture', 'Ready to Serve'],
      beverages: ['Refreshing', 'Chilled Option', 'Easy Pairing'],
      snacks: ['Quick Bite', 'Shareable', 'Pantry Ready'],
      meat: ['Protein Rich', 'Dinner Ready', 'Quality Cut'],
      frozen: ['Quick Prep', 'Freezer Ready', 'Convenient']
    };

    function starHTML(n) {
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function loadCart() {
      return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function loadWishlist() {
      return JSON.parse(localStorage.getItem(WISH_KEY) || '[]')
        .filter(item => typeof item === 'object' && item.id);
    }

    function saveWishlist(items) {
      localStorage.setItem(WISH_KEY, JSON.stringify(items));
    }

    function addProductToCart(product, qty = 1) {
      const cart = loadCart();
      const existing = cart.find(item => item.id === product.id);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ id: product.id, name: product.name, price: product.price, img: product.img, weight: product.weight, qty: qty });
      }
      saveCart(cart);
      showToast('"' + product.name + '" added to cart');
    }

    function toggleWishlist(product) {
      let wishlist = loadWishlist();
      if (wishlist.some(item => item.id === product.id)) {
        wishlist = wishlist.filter(item => item.id !== product.id);
        showToast('Removed "' + product.name + '" from wishlist');
      } else {
        wishlist.push(product);
        showToast('"' + product.name + '" saved to wishlist');
      }
      saveWishlist(wishlist);
      renderProducts();
    }

    function wishedIds() {
      return new Set(loadWishlist().map(item => item.id));
    }

    function cardHTML(product) {
      const wished = wishedIds().has(product.id);
      return `
        <div class="product-card" data-id="${product.id}">
          <button class="card-wish ${wished ? 'wished' : ''}" title="Add to Wishlist">${wished ? '♥' : '♡'}</button>
          <div class="card-img">
            <img src="${product.img}" alt="${product.name}" loading="lazy" />
          </div>
          <div class="card-body">
            <div class="card-category">${product.cat}</div>
            <div class="card-name">${product.name}</div>
            <div class="card-weight">${product.weight}</div>
            <div class="card-stars">
              <span class="stars">${starHTML(product.stars)}</span>
              <span class="rating-count">(${product.reviews})</span>
            </div>
            <div class="card-footer">
              <div class="card-price">
                <span class="price-now">$${product.price.toFixed(2)}</span>
                ${product.old ? `<span class="price-old">$${product.old.toFixed(2)}</span>` : ''}
              </div>
              <button class="add-btn" title="Add to cart">+</button>
            </div>
          </div>
        </div>
      `;
    }

    function filteredProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      return ALL_PRODUCTS.filter(product =>
        (currentCat === 'all' || product.cat === currentCat) &&
        (!q || product.name.toLowerCase().includes(q))
      );
    }

    function renderProducts() {
      const products = filteredProducts();
      document.getElementById('productCount').textContent = products.length + ' products';
      document.getElementById('productsGrid').innerHTML = products.map(cardHTML).join('');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function openModal(product) {
      modalProduct = product;
      modalQty = 1;

      document.getElementById('qtyNum').textContent = modalQty;
      document.getElementById('modalImg').src = product.img;
      document.getElementById('modalImg').alt = product.name;
      document.getElementById('modalCat').textContent = product.cat.charAt(0).toUpperCase() + product.cat.slice(1);
      document.getElementById('modalName').textContent = product.name;
      document.getElementById('modalStars').textContent = starHTML(product.stars);
      document.getElementById('modalReviews').textContent = '(' + product.reviews + ' reviews)';
      document.getElementById('modalWeight').textContent = product.weight;
      document.getElementById('modalOrganic').textContent = product.organic ? 'Yes' : 'No';
      document.getElementById('modalDesc').textContent = DESCRIPTIONS[product.cat] || 'A quality FoodMart product selected for your basket.';
      document.getElementById('modalPriceNow').textContent = '$' + product.price.toFixed(2);

      const oldPrice = document.getElementById('modalPriceOld');
      const save = document.getElementById('modalSave');
      if (product.old) {
        oldPrice.textContent = '$' + product.old.toFixed(2);
        oldPrice.style.display = '';
        save.textContent = 'Save ' + Math.round((1 - product.price / product.old) * 100) + '%';
        save.style.display = '';
      } else {
        oldPrice.style.display = 'none';
        save.style.display = 'none';
      }

      document.getElementById('modalBadges').innerHTML = product.badge ? '<div class="badges"><span class="badge badge-new">' + product.badge + '</span></div>' : '';
      document.getElementById('modalTags').innerHTML = (TAG_MAP[product.cat] || []).map(tag => '<span class="modal-tag">' + tag + '</span>').join('');

      const wishBtn = document.getElementById('modalWishBtn');
      const wished = wishedIds().has(product.id);
      wishBtn.textContent = wished ? '♥' : '♡';
      wishBtn.classList.toggle('wished', wished);

      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('catTabs').addEventListener('click', event => {
      const tab = event.target.closest('.cat-tab');
      if (!tab) return;

      document.querySelectorAll('.cat-tab').forEach(item => item.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.dataset.cat;
      renderProducts();
    });

    document.getElementById('searchInput').addEventListener('input', renderProducts);

    document.getElementById('productsGrid').addEventListener('click', event => {
      const card = event.target.closest('.product-card');
      if (!card) return;

      const product = ALL_PRODUCTS.find(item => item.id === parseInt(card.dataset.id));
      if (!product) return;

      if (event.target.closest('.add-btn')) {
        addProductToCart(product);
        return;
      }

      if (event.target.closest('.card-wish')) {
        toggleWishlist(product);
        return;
      }

      openModal(product);
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', event => {
      if (event.target === document.getElementById('modalOverlay')) closeModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeModal();
    });

    document.getElementById('qtyMinus').addEventListener('click', () => {
      if (modalQty > 1) {
        modalQty -= 1;
        document.getElementById('qtyNum').textContent = modalQty;
      }
    });

    document.getElementById('qtyPlus').addEventListener('click', () => {
      if (modalQty < 99) {
        modalQty += 1;
        document.getElementById('qtyNum').textContent = modalQty;
      }
    });

    document.getElementById('modalAddBtn').addEventListener('click', () => {
      if (!modalProduct) return;
      addProductToCart(modalProduct, modalQty);
    });

    document.getElementById('modalWishBtn').addEventListener('click', () => {
      if (!modalProduct) return;
      toggleWishlist(modalProduct);
      const wished = wishedIds().has(modalProduct.id);
      document.getElementById('modalWishBtn').textContent = wished ? '♥' : '♡';
      document.getElementById('modalWishBtn').classList.toggle('wished', wished);
    });

    renderProducts();
  </script>
</body>
</html>
