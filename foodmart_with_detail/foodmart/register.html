<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - FoodMart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="account-page">
  <main class="auth-shell">
    <section class="auth-panel">
      <a href="index.html" class="auth-logo">
        <span class="logo-icon">FM</span>
        <span>FOOD<span>MART</span></span>
      </a>

      <div class="auth-copy">
        <span class="cart-kicker">Customer account</span>
        <h1>Create your account</h1>
        <p>Register once, then your personal FoodMart details will be saved for the demo.</p>
      </div>

      <form class="auth-form" id="registerForm">
        <label>
          Full name
          <input type="text" id="fullName" placeholder="Your full name" required />
        </label>

        <label>
          Email
          <input type="email" id="email" placeholder="you@example.com" required />
        </label>

        <label>
          Phone number
          <input type="tel" id="phone" placeholder="+855 12 345 678" required />
        </label>

        <label>
          Delivery address
          <textarea id="address" rows="3" placeholder="Street, city, country" required></textarea>
        </label>

        <label>
          Password
          <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required />
        </label>

        <button type="submit" class="auth-submit">Register account</button>
      </form>

      <p class="auth-note">Already registered? <a href="account.html">View personal account</a></p>
    </section>
  </main>

  <script>
    const ACCOUNT_KEY = 'foodmart_demo_account';

    document.getElementById('registerForm').addEventListener('submit', event => {
      event.preventDefault();

      const account = {
        name: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        joined: new Date().toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        })
      };

      localStorage.setItem(ACCOUNT_KEY, JSON.stringify(account));
      window.location.href = 'account.html';
    });
  </script>
</body>
</html>
